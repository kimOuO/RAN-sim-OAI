services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://${SERVER_IP}:8000"
        NEXT_PUBLIC_OMNIVERSE_URL: "http://${SERVER_IP}:8001"
        NEXT_PUBLIC_VNC_URL: "http://${SERVER_IP}:6080/vnc.html"
        NEXT_PUBLIC_WS_URL: "ws://${SERVER_IP}:8000/ws/sim/live/"
    image: ranp-sim-frontend:dev
    container_name: ranp-sim-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    depends_on:
      ranp-sim:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://${SERVER_IP}:8000"
      OMNIVERSE_URL: "http://${SERVER_IP}:8001"
      VNC_URL: "http://${SERVER_IP}:6080/vnc.html"
      WS_URL: "ws://${SERVER_IP}:8000/ws/sim/live/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - omniver_default

  ranp-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: ranp-sim:dev
    container_name: ranp-sim
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sionna RT 需要 OptiX → 必須開啟 graphics capability 才能從 host 掛入 libnvoptix
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,graphics,video"
    ports:
      - "${HTTP_PORT:-8000}:8000"
    volumes:
      # 開發 mode (方案 A): 程式碼直接掛進來，改 code 立即生效不用 rebuild
      - .:/app
      # 外部 source (scene_config.json) 掛到 /mnt/srcin，避免 target 落在 /app 內
      # 造成 host 側 external/ 空目錄殘留（docker bind mount 的 target 互相干涉）
      - ..:/mnt/srcin:ro
      # Sionna / Mitsuba CUDA kernel cache，避免每次啟動重下
      - sionna-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{}", "http://localhost:8000/api/v0.1/RanpSim/RanSignal/HealthChecker/read"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  sionna-cache:

networks:
  omniver_default:
    external: true
