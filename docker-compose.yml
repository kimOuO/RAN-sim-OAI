# Platform-level orchestration: CU + DU + RU + Physics + (Dashboard) + Postgres
# Build context for some services 需要看 sibling 目錄（e.g. DU 需要看 Physics_sim/ran-sim-protocol），
# 所以 build context 設成 XAPP_DT 根目錄。
#
# 用法：
#   cd /home/mitlab/XAPP_DT
#   docker compose -f docker-compose.yml up -d --build
#
# 個別 repo 自己的 docker-compose.yml 仍可獨立用（solo dev / test）。

name: ransim-platform

services:

  # ── shared 共用 Postgres（多資料庫由 init.sql 建）────────────
  postgres:
    image: postgres:16-alpine
    container_name: ransim-postgres
    environment:
      POSTGRES_USER: ransim
      POSTGRES_PASSWORD: ransim
      POSTGRES_DB: ransim_root
    volumes:
      - ransim-pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"   # 5432 已被 omniver_postgres 佔用，host 用 5433；container 內部仍 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ransim"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ransim-net

  # ── CU（控制面 + 用戶面）───────────────────────────────────
  cu:
    build:
      context: ./RANsim-CU
      dockerfile: Dockerfile
    image: ransim-cu:platform
    container_name: ransim-cu
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cu_db
      DB_USER: ransim
      DB_PASSWORD: ransim
      HTTP_DU_HOST: du
      HTTP_DU_PORT: 8000
      HTTP_CUUP_HOST: ""    # 空 = integrated mode（cu_up 在同 process）
      LOG_DIR: /app/logs
      # globalE2node-ID — e2-adapter 透過 /CU/E2/E2NodeId/read 拿
      PLMN_MCC: "208"
      PLMN_MNC: "95"
      # AC5 — 對齊 OAI gNB_ID 值 0xe00 (= 3584)。E2AP ASN.1 BIT STRING SIZE(22..32) 強制至少 22-bit,
      # OAI conf 寫 0xe00 但 ASN.1 wire 上是 22-bit (0x000e00),value 相同。
      GNB_ID_HEX: "0x000e00"
      GNB_ID_LENGTH: "22"
      RAN_FUNC_ID_KPM: "2"
      RAN_FUNC_ID_RC: "3"
      # 2026-05-16 P3.2/P3.3: TAC / SST env shells — 對齊 OAI conf。
      # 接口存在,值會編進 NGAP NG Setup PDU,但平台內部不做 TAU / slice 分流邏輯。
      SERVED_TAC: "0xa000"
      SST: "1"
      # AC4 — A3 handover threshold 預設值
      # 原為快觸發 (0.5/0.3/60),fast-replay 模式 RSRP 雜訊 ±5dB 導致 ping-pong。
      # 拉成保守值 (3 dB offset / 2 dB hys / 300 ms TTT) 抑制反覆切換。
      # Runtime 還是可以透過 Dashboard /Mobility/A3Controller/set 覆寫。
      # 2026-05-28 — Bug A:Sionna live mode RSRP multipath 抖動,
      # 8 dB 門檻 + 1s TTT 仍頻繁 ping-pong(實測 24h 50 筆 SUCC HO 在兩 cell 之間反覆)。
      # 拉高 HYSTERESIS 3 → 6(total 11 dB),TTT 1s → 3s。
      HO_A3_OFFSET_DB: "5.0"      # 鄰居要強過服務 5 dB 才考慮
      HO_A3_HYSTERESIS_DB: "6.0"  # 加 6 dB 緩衝 → 實際門檻 11 dB
      HO_TTT_MS: "3000"           # 3 秒 wall(2x mode = 6 sim-sec)持續滿足才觸發
      # 2026-05-17 #1: handover_executor 落地後 fire-and-forget 推給 Omniverse,
      # 讓 playback 把 HO 切回對應 frame。空字串 = 停推。
      OMNIVERSE_URL: "http://${SERVER_IP:-host.docker.internal}:8001"
    volumes:
      - ./RANsim-CU:/app
      - ./Physics_sim/ran-sim-protocol:/opt/ran-sim-protocol
    ports:
      - "8101:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ransim-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── DU（MAC + RLC + PHY-High + F1AP + FAPI + Tick）──────────
  du:
    build:
      context: .             # XAPP_DT 根，因為 Dockerfile COPY 用 Physics_sim/ran-sim-protocol
      dockerfile: RANsim-DU/Dockerfile
    image: ransim-du:platform
    container_name: ransim-du
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: du_db
      DB_USER: ransim
      DB_PASSWORD: ransim
      HTTP_CU_HOST: cu
      HTTP_CU_PORT: 8000
      HTTP_RU_HOST: ru
      HTTP_RU_PORT: 8000
      LOG_DIR: /app/logs
      # AL: tick 從 500ms → 50ms (10x drain rate) — 跟上 UE 100ms inject 不堆 buffer.
      SIM_TICK_MS: 50
      # AL: PM 報告 window (wall-clock 秒). default 1.0s. tick_runner 自動算
      # REPORT_EVERY_N_TICKS = round(PM_WINDOW_SEC * 1000 / SIM_TICK_MS).
      # SIM_TICK_MS=50 配 PM_WINDOW_SEC=1.0 → 20 ticks/window.
      PM_WINDOW_SEC: "1.0"
      # PRB% KPM 輸出校正係數(`pm_aggregator.PRB_OAI_CALIB`)。
      # 2026-05-23 P1.11 設 10.0 是為對齊 OAI rfsim normal phase(DT raw 1% × 10 ≈ OAI 10%)。
      # 但這是經驗映射不是物理常數,raw > 10% 後 ×10 必爆 100% clamp,xApp 看到的
      # RC PRB quota 效果完全失真(下 max=3% → KPM 仍報 100%)。
      # 預設改回 1.0(raw 不校正),docs/test_records/oai_kpm_calibration_2026-05-23.md
      # 對照測試前再切回 10.0。
      PRB_OAI_CALIB: "1.0"
      # RLC tx buffer 上限。
      # 2026-05-23 P1.12 — 從 500K 拉到 10 MB。500K 對 3 Mbps × 500ms tick (187 KB/tick)
      # 仍只能撐 2-3 tick 就觸發 drop,scheduler 還沒 scale up PRB 就丟 SDU。
      # 10 MB headroom 讓 scheduler 有時間靠 prb_needed=ceil(buffer/bytes_per_prb)
      # 自動拉高 PRB 配額(burst 期間可達 ≥50 PRB / 接近 BW cap),3 Mbps 真正流通。
      RLC_TX_MAXSIZE_BYTES: 10000000
      # P0b — RLC delay 計算模式:calib(現狀,wall+/30擬合) | subtick(FIFO sim-time 解析模型)。
      # 2026-06-01 B1 驗證發現:subtick 誠實報出 DT 真實 ~140KB 常駐 backlog → ~430ms delay,
      # 比 OAI 14ms 大,因 DT 注入 burst + tick 粒度排空。calib 的 /30 是把這壓成虛構 14ms。
      # → subtick 單獨無法達 OAI(delay 是真實佇列非量測假象),default 維持 calib。
      RLC_DELAY_MODEL: "calib"
      # 對齊 sim CU globalE2node-ID — DU 用同一組 PLMN 衍生 cell.served_plmn,
      # 不再寫死 dummy "00101"。caller 不指定時 default 走 env 衍生.
      PLMN_MCC: "208"
      PLMN_MNC: "95"
    volumes:
      - ./RANsim-DU:/app
      - ./Physics_sim/ran-sim-protocol:/opt/ran-sim-protocol
    ports:
      - "8102:8000"
    depends_on:
      postgres:
        condition: service_healthy
      cu:
        condition: service_started
    networks:
      - ransim-net

  # ── RU（PlanarArray + Beamforming + FAPI + PhysicsClient）───
  ru:
    build:
      context: ./RANsim-RU
      dockerfile: Dockerfile
    image: ransim-ru:platform
    container_name: ransim-ru
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ru_db
      DB_USER: ransim
      DB_PASSWORD: ransim
      HTTP_DU_HOST: du
      HTTP_DU_PORT: 8000
      HTTP_PHYSICS_HOST: physics
      HTTP_PHYSICS_PORT: 8000
      LOG_DIR: /app/logs
      # 跟 Sionna scene default + Dashboard MimoSettings default 對齊（1×1 V）
      # 真實使用時由 Dashboard Build Scene 推 update_antenna 覆蓋成 user 在 UI 選的值
      RU_DEFAULT_ANTENNA_ROWS: 1
      RU_DEFAULT_ANTENNA_COLS: 1
      RU_DEFAULT_POLARIZATION: V
      RU_DEFAULT_PATTERN: tr38901
      RU_NUMEROLOGY: 1
      # P1.5 — 40 MHz thermal noise (-174 + 10log(40e6) + NF=3) ≈ -98 dBm。
      RU_NOISE_FLOOR_DBM: -98
      RU_CHANNEL_CACHE_TTL_SEC: 0.5
      # AC5 — RU link budget。原本程式 fallback (43.0 / 36.0),移到 compose 集中管理。
      # antenna_gain 已併入 scene_calibration_loss (歷史 50 → 36 = +14 dBi 內含)。
      # P1.4 補修 — OAI rfsim 字面 PDSCH total ≈ 4 dBm,但 max_rxgain=114 dB 等效
      # 把 link budget 抬回去。DT 沒 RX gain 元件,直接用 23 dBm TX 補上,讓
      # RSRP 落在 -82 dBm 對齊 OAI 實效範圍(非字面 TX)。
      RU_TX_POWER_DBM: "23.0"
      # P0.2 — OAI rfsim AWGN 通道沒模擬 O2I/body/shadowing,DT 改 0 dB 對齊。
      # 歷史值 36 (Brownstone urban 校正);換 OAI 對照場景時設 0。
      RU_SCENE_CALIBRATION_LOSS_DB: "0.0"
      # AK6: cell→Sionna gNB map 改成完全 DB-driven, 不再用 env override.
      # Dashboard 創 gNB 後 call /Physics/Scene/SceneGateway/init 重建 Sionna scene,
      # path_gain dict 就會用用戶輸入的 gnb name (e.g. "gnb4") 當 key.
      # 之前 env hardcode 拔掉 (見 AK5 history).
      # Phase B B.3 — cached channel mode. default 'live' (走 Sionna HTTP),
      # 切 'cached' + 設 RU_SCENARIO_ID 則 dl_tti_pipeline 從 /data 查 npz。
      RU_CHANNEL_MODE: "${RU_CHANNEL_MODE:-live}"
      RU_SCENARIO_ID: "${RU_SCENARIO_ID:-}"
      RU_CACHE_DIR: "/data/channel_cache"
    volumes:
      - ./RANsim-RU:/app
      - ./Physics_sim/ran-sim-protocol:/opt/ran-sim-protocol
      # Phase B — share channel cache parquet from physics container
      # 不再 :ro,因為 RU 自己要寫 .mode file 給 multi-worker 同步 channel mode
      - ./Physics_sim/data:/data
    ports:
      - "8103:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ransim-net

  # ── Physics（Sionna RT，需要 GPU）─────────────────────────
  physics:
    build:
      context: ./Physics_sim
      dockerfile: Dockerfile
    image: ransim-physics:platform
    container_name: ransim-physics
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: physics_db
      DB_USER: ransim
      DB_PASSWORD: ransim
      LOG_DIR: /app/logs
      MITSUBA_SCENE_PATH: /app/scenes/umi_3sector.xml
      # Sionna RT 用 Mitsuba/OptiX 做 ray tracing；driver 預設只 expose
      # compute+utility，需加 graphics 才會掛 liboptix
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,graphics"
      # Phase B precompute worker 回呼 Omniverse 更新 status,跨 compose 走 host-gateway
      OMNIVERSE_URL: "http://${SERVER_IP:-host.docker.internal}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Physics_sim:/app
      - ./Physics_sim/scenes:/app/scenes:ro
      - ./scene_config.json:/mnt/srcin/scene_config.json:ro   # 平台共享 scene
    ports:
      - "8104:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ransim-net

  # ── Dashboard（Next.js 前端，現階段保留舊 frontend）──────
  # 注意：Dashboard 在 Physics_sim/Dashboard/ 內，build context 指過去
  dashboard:
    build:
      context: ./Physics_sim/Dashboard
      dockerfile: Dockerfile.dev   # dev mode → 支援 hot-reload + bind mount
    image: ransim-dashboard:dev
    container_name: ransim-dashboard
    # 啟動時 npm install 補裝 package.json 新增的 dep（已裝的會被 skip）
    # 避免 anonymous volume 把 node_modules 凍在 image build 時的狀態
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    environment:
      # 跨機器存取：browser 在 windows 開 :3010，但 backend port 用 server IP 才連得到
      # 改機器部署時改 .env 的 SERVER_IP 即可
      NEXT_PUBLIC_CU_URL: "http://${SERVER_IP:-localhost}:8101"
      NEXT_PUBLIC_DU_URL: "http://${SERVER_IP:-localhost}:8102"
      NEXT_PUBLIC_RU_URL: "http://${SERVER_IP:-localhost}:8103"
      NEXT_PUBLIC_E2_ADAPTER_URL: "http://${SERVER_IP:-localhost}:8201"
      NEXT_PUBLIC_UE_URL: "http://${SERVER_IP:-localhost}:8105"
      NEXT_PUBLIC_PHYSICS_URL: "http://${SERVER_IP:-localhost}:8104"
      NEXT_PUBLIC_API_BASE_URL: "http://${SERVER_IP:-localhost}:8104"   # 舊變數兼容（→ Physics）
      NEXT_PUBLIC_OMNIVERSE_URL: "http://${SERVER_IP:-localhost}:8001"
      NEXT_PUBLIC_VNC_URL: "http://${SERVER_IP:-localhost}:6080/vnc.html"
      NEXT_PUBLIC_WS_URL: "ws://${SERVER_IP:-localhost}:8104/ws/sim/live/"
      # ↓ app/layout.tsx 用無前綴版本注入 window.__APP_CONFIG__（getRuntimeConfig 優先級最高）
      # 跨機器 fix 必須這邊也設，否則 fallback localhost 會蓋掉 client side resolveHost
      API_BASE_URL: "http://${SERVER_IP:-localhost}:8104"
      OMNIVERSE_URL: "http://${SERVER_IP:-localhost}:8001"
      VNC_URL: "http://${SERVER_IP:-localhost}:6080/vnc.html"
      WS_URL: "ws://${SERVER_IP:-localhost}:8104/ws/sim/live/"
      CU_URL: "http://${SERVER_IP:-localhost}:8101"
      DU_URL: "http://${SERVER_IP:-localhost}:8102"
      RU_URL: "http://${SERVER_IP:-localhost}:8103"
      PHYSICS_URL: "http://${SERVER_IP:-localhost}:8104"
      E2_ADAPTER_URL: "http://${SERVER_IP:-localhost}:8201"
      UE_URL: "http://${SERVER_IP:-localhost}:8105"
    volumes:
      - ./Physics_sim/Dashboard:/app
      - /app/node_modules                              # 保留 image 內 node_modules
      - /app/.next                                     # build artifact 存在 container
    ports:
      - "3010:3000"   # host 3000 被 Omniverse debugpy 佔用
    depends_on:
      - cu
    networks:
      - ransim-net

  # ── E2 Adapter（HTTP REST ↔ ASN.1/SCTP RIC 翻譯器）─────────────
  # P2.7 階段：骨架 only；E2_ADAPTER_LINK_ENABLED=0 → 不嘗試連 RIC
  # P2.8 起會把 SCTP loop 接通到 RIC e2term
  # 注意：network_mode: host — pysctp 跨主機 SCTP 在 bridge 模式會踩 self-ABORT
  e2adapter:
    build:
      context: ./RANsim-E2Adapter
      dockerfile: Dockerfile
    image: ransim-e2adapter:platform
    container_name: ransim-e2adapter
    network_mode: host        # SCTP outbound 跨主機必要
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      LOG_DIR: /app/logs
      # network_mode: host → "cu" 主機名解析不到，用 server IP + CU port (8101)
      SIM_CU_URL: "http://127.0.0.1:8101"
      RIC_E2TERM_HOST: "10.3.0.71"
      # Port 36422 (NOT 32222) — Cilium kpr eBPF 不重寫 SCTP NodePort（cilium #32412），
      # e2term 用 hostNetwork=true 直接綁 host 的 36422
      RIC_E2TERM_PORT: "36422"
      # SCTP multi-homing self-ABORT 修復 — bind enp1s0 IP，避免廣告 docker0 IP
      # 給 RIC（會跟 RIC 自己的 docker0=172.17.0.1 碰撞，HEARTBEAT 自迴觸發 ABORT）
      SCTP_BIND_IP: "10.3.0.217"
      E2_ADAPTER_LINK_ENABLED: "1"   # P2.8 階段：嘗試開 SCTP loop（目前 stub）
      ASN1_SCHEMA_DIR: /app/asn1
      ADAPTER_HTTP_PORT: "8201"     # 0.0.0.0:8201 — 8000 被 Omniverse debugpy 佔用
    volumes:
      - ./RANsim-E2Adapter:/app

  # ── UE Container（Active UE Object — Phase A skeleton）────────
  # 跑 N UE thread，per-UE 從 CU 同步狀態。Phase A 只做 lifecycle skeleton，
  # 之後 phase 加 trajectory / traffic / measurement / UCI report
  ue:
    build:
      context: ./RANsim-UE
      dockerfile: Dockerfile
    image: ransim-ue:platform
    container_name: ransim-ue
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      LOG_DIR: /app/logs
      # 各 RANsim component URL (透過 docker network)
      SIM_CU_URL: "http://cu:8000"
      SIM_DU_URL: "http://du:8000"
      SIM_RU_URL: "http://ru:8000"
      SIM_PHYSICS_URL: "http://physics:8000"
      OMNIVERSE_KIT_URL: "http://${SERVER_IP:-localhost}:8080"
      # Phase B B.4 — scenario driver fetch scenario JSON from Omniverse
      OMNIVERSE_URL: "http://${SERVER_IP:-host.docker.internal}:8001"
      # Tick 週期
      UE_TRAJECTORY_PERIOD_MS: "100"
      # AC5 — 原 80 ms ≥ HO_TTT_MS 60 ms,A3 觸發條件量不到第二次。降到 40 ms 留 buffer。
      UE_MEASUREMENT_PERIOD_MS: "40"
      UE_LIST_POLL_PERIOD_SEC: "5"
      # AL: batch inject 模式 — on = per-packet enqueue_ts (對齊 OAI),
      # off = 舊巨型 SDU (向後相容). 初期 default off, RIC team ready 後切 on.
      INJECT_BATCH_MODE: "on"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./RANsim-UE:/app
    ports:
      - "8105:8000"   # ransim-ue HTTP (CU=8101 / DU=8102 / RU=8103 / Physics=8104)
    depends_on:
      cu:
        condition: service_started
    networks:
      - ransim-net


volumes:
  ransim-pgdata:


networks:
  ransim-net:
    driver: bridge
    name: ransim-net
