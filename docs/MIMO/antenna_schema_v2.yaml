      start_prbc: {type: uint, range: [0, 1023], norm: ORAN-N, src: [CUS-032], ref: "10 bit"}
      num_prbc: {type: uint, range: [0, 255], norm: ORAN-N, src: [CUS-032], ref: "8 bit"}
      re_mask: {type: bitstring, length: 12, norm: ORAN-N, src: [CUS-032], ref: "12 bit"}
      num_bund_prb: {type: uint8, range: [1, 255], optional: true, norm: ORAN-N, src: [CUS-048], ref: "SE11（0 保留）"}
      ue_id: {type: uint16, range: [0, 32767], optional: true, note: "CIBF/DMRS-BF 時使用；0x7FFF 在特定條件下表示不排程", norm: ORAN-N, src: [CUS-035], ref: "CUS §7.5.3.10"}
      weights_ref: {type: string, norm: SIM, src: [CUS-041], ref: "指向 beam_capability 中的權重或 SE1/SE11/SE19 的內容"}
  csi_rs_resources:
    type: list
