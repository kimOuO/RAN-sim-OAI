        ri_restriction: {type: bitstring, length_by_type: {typeI-SinglePanel: 8, typeI-MultiPanel: 4, typeII: 2, typeII-PortSelection: 2, r16_r17_r18_r19_typeII: 4}, default: all_ones, norm: 3GPP-N, src: [331-009], ref: "38.331 CodebookConfig"}
        number_of_beams_L: {type: enum, enum: [2, 3, 4], optional: true, norm: 3GPP-N, src: [214-058, 331-009], ref: "numberOfBeams"}
