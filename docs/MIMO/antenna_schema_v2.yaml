      nzp_csi_rs_resource_id: {type: uint, range: [0, 191], norm: 3GPP-N, src: [331-001, 331-040], ref: "maxNrofNZP-CSI-RS-Resources = 192"}
      nrof_ports: {type: ref, target: logical_port_capability.csi_rs.nrof_ports_per_resource, norm: 3GPP-N, src: [331-002], ref: "38.331 p.862"}
      mapping_row: {type: int, range: [1, 18], norm: 3GPP-N, src: [211-034], ref: "38.211 Table 7.4.1.5.3-1"}
      cdm_type: {type: ref, target: logical_port_capability.csi_rs.cdm_type, norm: 3GPP-N, src: [331-002], ref: "38.331"}
      density: {type: ref, target: logical_port_capability.csi_rs.density, norm: 3GPP-N, src: [331-002], ref: "38.331"}
      first_ofdm_symbol: {type: int, range: [0, 13], norm: 3GPP-N, src: [331-002], ref: "38.331"}
      frequency_domain_allocation: {type: bitstring, length_by_row: {row1: 4, row2: 12, row4: 3, other: 6}, norm: 3GPP-N, src: [331-002, 211-033], ref: "38.331 p.862"}
      starting_rb: {type: int, multiple_of: 4, norm: 3GPP-N, src: [331-003], ref: "38.331 p.833"}
      nrof_rbs: {type: int, multiple_of: 4, min: 24, norm: 3GPP-N, src: [331-003], ref: "38.331 p.833"}
      power_control_offset: {type: int, range: [-8, 15], unit: dB, norm: 3GPP-N, src: [331-001, 214-070], ref: "38.331 p.1022"}
      power_control_offset_ss: {type: enum, enum: [-3, 0, 3, 6], unit: dB, optional: true, norm: 3GPP-N, src: [331-001], ref: "38.331 db-3/db0/db3/db6"}
      periodicity_slots: {type: int, optional: true, norm: 3GPP-N, src: [331-001], ref: "periodicityAndOffset"}
      qcl_info_periodic_tci_id: {type: int, optional: true, norm: 3GPP-N, src: [331-001, 214-070], ref: "qcl-InfoPeriodicCSI-RS"}
      beam_id_oru: {type: uint16, norm: SIM, src: [CUS-056], ref: "O-RU 側可用 SE19 以 port 為單位下發 beamId", why_sim: "CSI-RS resource 與 O-RU beamId 的對應未標準化"}
  csi_rs_resource_sets:
