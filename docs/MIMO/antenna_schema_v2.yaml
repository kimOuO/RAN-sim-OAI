    item:
      tci_state_id: {type: int, range: [0, 127], norm: 3GPP-N, src: [331-010, 331-040], ref: "38.331 TCI-State p.1284"}
      qcl_type1: {type: QclInfo, mandatory: true, norm: 3GPP-N, src: [331-010], ref: "38.331"}
      qcl_type2: {type: QclInfo, optional: true, constraint: "type != qcl_type1.type", norm: 3GPP-N, src: [331-010, 214-002], ref: "38.214 §5.1.5 p.50"}
  QclInfo:
    cell: {type: int, optional: true, note: "僅 typeC/typeD 可位於其他 cell", norm: 3GPP-N, src: [331-010], ref: "38.331 p.1285"}
    reference_signal: {type: "choice{csi_rs: NZP-CSI-RS-ResourceId, ssb: SSB-Index}", norm: 3GPP-N, src: [331-010], ref: "38.331"}
    qcl_type: {type: enum, enum: [typeA, typeB, typeC, typeD], norm: 3GPP-N, src: [214-001, 331-010], ref: "38.214 §5.1.5 p.50"}
  active_tci:
    activated_codepoints: {type: "int[]", max_items: 8, norm: 3GPP-N, src: [321-005, 214-004], ref: "38.321 §6.1.3.14"}
    activated_unified_states: {type: "int[]", max_items: 16, norm: 3GPP-N, src: [321-006], ref: "38.321 §6.1.3.47"}
    indicated_dl_tci: {type: int, optional: true, norm: 3GPP-N, src: [214-005, 214-007], ref: "38.214 §5.1.5"}
    indicated_ul_tci: {type: int, optional: true, norm: 3GPP-N, src: [214-005, 331-011], ref: "38.331 TCI-UL-State"}
    beam_app_time_symbols: {type: enum, enum: [1, 2, 4, 7, 14, 28, 42, 56, 70, 84, 98, 112, 224, 336], norm: 3GPP-N, src: [S331-006, 214-007], ref: "38.331 beamAppTime-r17 p.1053"}
    application_slot: {type: int, norm: DERIVED, src: [214-007, 214-008], ref: "ACK 後依 beamAppTime 或 3 ms 規則計算"}
  layers:
    pdsch_layers: {type: int, range: [1, 8], default: 1, norm: 3GPP-N, src: [214-020], ref: "38.214 §5.1.1"}
    pdsch_dmrs_ports: {type: "int[]", item_range: [1000, 1023], default: [1000], norm: 3GPP-N, src: [212-001, 214-023], ref: "38.212 §7.3.1.2.2"}
    num_codewords: {type: int, range: [1, 2], formula: "1 if layers<=4 else 2", norm: 3GPP-N, src: [211-015, 300-001], ref: "38.211 Table 7.3.1.3-1"}
    pusch_layers: {type: int, range: [1, 8], default: 1, norm: 3GPP-N, src: [214-081, 300-002], ref: "38.214 §6.1.1"}
    pusch_tpmi: {type: int, optional: true, norm: 3GPP-N, src: [211-011, 214-081], ref: "38.211 Tables 6.3.1.5-x"}
    pusch_sri: {type: "int[]", optional: true, norm: 3GPP-N, src: [212-010, 214-081], ref: "38.212 §7.3.1.1.2"}
  reports:
    type: list
    item:
      time_slot: {type: int, norm: SIM, src: [], ref: "simulator 時戳"}
      cri_or_ssbri: {type: int, note: "resource set 內的序號，不是 resource ID", norm: 3GPP-N, src: [214-044], ref: "38.214 §5.2.1.4.2"}
      l1_rsrp_code: {type: int, range: [16, 113], unit: "RSRP_k", norm: 3GPP-N, src: [133-023, 214-042], ref: "38.133 Table 10.1.6.1-1（7 bit）"}
      diff_rsrp_code: {type: int, range: [0, 15], step_dB: 2, norm: 3GPP-N, src: [133-024], ref: "38.133 Table 10.1.6.1-2（4 bit）"}
      l1_sinr_code: {type: int, range: [0, 127], step_dB: 0.5, norm: 3GPP-N, src: [133-025, 214-043], ref: "38.133 Table 10.1.16.1-1"}
      ri: {type: int, range: [1, 8], norm: 3GPP-N, src: [212-021], ref: "38.212 Table 6.3.1.1.2-3"}
      pmi: {type: object, note: "i1,1 i1,2 (i1,3) i2", norm: 3GPP-N, src: [214-052, 212-020], ref: "38.212 Table 6.3.1.1.2-1"}
      cqi_wb: {type: int, range: [0, 15], norm: 3GPP-N, src: [212-021, 214-050], ref: "4 bit"}
      li: {type: int, optional: true, norm: 3GPP-N, src: [212-021], ref: "38.212"}
  ssb_beam_state:
    selected_ssb_index: {type: int, range: [0, 63], norm: 3GPP-N, src: [213-002], ref: "38.213 §4.1"}
    ss_rsrp_dBm: {type: float, unit: dBm, norm: 3GPP-N, src: [215-001], ref: "38.215 §5.1.1"}
  bfd:
    q0: {type: "rs[]", max_items: 10, note: "隱式時 <= 2；單 port", norm: 3GPP-N, src: [213-010, 213-011, S331-005], ref: "38.213 §6 p.19"}
    q1: {type: "rs[]", max_items: 16, note: "1 或 2 port 的 CSI-RS 或 SSB", norm: 3GPP-N, src: [213-010, S331-005], ref: "maxNrofCandidateBeams"}
    bfi_counter: {type: int, default: 0, norm: 3GPP-N, src: [321-002], ref: "38.321 §5.17"}
    beam_failure_instance_max_count: {type: enum, enum: [1, 2, 3, 4, 5, 6, 8, 10], norm: 3GPP-N, src: [321-001, 331-019], ref: "38.331 RadioLinkMonitoringConfig"}
    beam_failure_detection_timer: {type: enum, enum: [1, 2, 3, 4, 5, 6, 8, 10], unit: "Qout,LR reporting periods", norm: 3GPP-N, src: [321-001, 331-019], ref: "38.331 p.1150"}
    beam_failure_recovery_timer_ms: {type: enum, enum: [10, 20, 40, 60, 80, 100, 150, 200], unit: ms, norm: 3GPP-N, src: [321-001, 331-020], ref: "38.331 BeamFailureRecoveryConfig p.735"}
    qout_lr_bler: {type: const, value: 0.10, norm: 3GPP-N, src: [133-011], ref: "38.133 §8.5.1"}
    qin_lr: {type: ref, target: rsrp-ThresholdSSB, unit: dBm, norm: 3GPP-N, src: [133-011, 213-012, 331-020], ref: "RSRP-Range"}
    bfi_period_ms: {type: formula, value: "max(min_periodicity(q0), 2)", norm: 3GPP-N, src: [213-013], ref: "38.213 §6 p.20（non-DRX）"}
    q_new: {type: rs, optional: true, norm: 3GPP-N, src: [213-015], ref: "38.213 §6"}
    post_response_switch_symbols: {type: const, value: 28, norm: 3GPP-N, src: [213-016], ref: "38.213 §6 p.20"}
    state: {type: enum, enum: [normal, detecting, recovering], default: normal, norm: SIM, src: [321-002, 321-003], ref: "狀態列舉為 simulator 自訂"}
  rlm:
    bler_out: {type: const, value: 0.10, norm: 3GPP-N, src: [133-002], ref: "38.133 Table 8.1.1-1"}
    bler_in: {type: const, value: 0.02, norm: 3GPP-N, src: [133-002], ref: "38.133 Table 8.1.1-1"}
    n_rlm_max: {type: table, value: {"4": 2, "8": 4, "64": 8}, norm: 3GPP-N, src: [133-003], ref: "38.133 Table 8.1.1-2"}
  pathloss_rs: {type: "rs[]", max_items: 4, norm: 3GPP-N, src: [213-020], ref: "38.213 §7 p.25"}
  beam_tilt_state:
    description: "O-RAN 數位 beam tilt offset（deg）。與 RET 機電 tilt（ald[].antenna[].tilt_value，0.1 度步距）為兩套獨立參數，不可互換（R-L6-49）"
    elevation: {type: int16, range: [-90, 90], unit: deg, default: 0, norm: ORAN-N, src: [MP-049, ORAN-B22], ref: "BF predefined-beam-tilt-state"}
    azimuth: {type: int16, range: [-90, 90], unit: deg, default: 0, norm: ORAN-N, src: [MP-049, ORAN-B22], ref: "BF predefined-beam-tilt-state"}
  ald:
    type: list
    description: "ALD（RET / TMA）控制狀態機，TS 37.466 / 37.461 / 37.462 V19.0.0；O-RAN 下經 rpc ald-communication 以 binary 透傳（MP-140/141）"
    item:
      device_type: {type: enum, enum: [single_antenna_ret, multi_antenna_ret, tma], wire_codes: {single_antenna_ret: 0x01, multi_antenna_ret: 0x11, tma: 0x02}, norm: 3GPP-N, src: [37462-002], ref: "TS 37.462 V19.0.0 §4.7 Table 4.7.1 p.8-9"}
      app_part: {type: enum, enum: [RETAP, TMAAP], norm: 3GPP-N, src: [37466-001], ref: "TS 37.466 V19.0.0 §1 p.6"}
      device_state: {type: enum, enum: [OperatingMode, DownloadMode], default: OperatingMode, norm: 3GPP-N, src: [37466-008], ref: "TS 37.466 §6.1 Figure 6.1 p.10-11"}
      num_antennas: {type: uint8, range: [1, 255], default: 1, norm: 3GPP-N, src: [37466-021], ref: "TS 37.466 §6.7.9 p.34（AntennaGetNumberOfAntennas 0x88）"}
      antenna:
        type: list
        item:
          antenna_number: {type: uint8, range: [1, 255], norm: 3GPP-N, src: [37466-005], ref: "TS 37.466 §4.3 p.9（Antennas are numbered 1 and upwards）"}
          tilt_value: {type: int16, unit: "0.1 deg", norm: 3GPP-N, src: [37466-003, 37466-013], ref: "TS 37.466 §3.1 p.8; §6.6.4 p.26（GetTilt 0x34）"}
      calibrated: {type: bool, default: false, note: "false 時 tilt 程序回 NotCalibrated", norm: 3GPP-N, src: [37466-015], ref: "TS 37.466 §6.6.1 p.23-24（Calibrate 0x31，回應 <4 min）"}
      configured: {type: bool, default: false, note: "false 時回 NotConfigured；configuration data payload 為 vendor specific", norm: 3GPP-N, src: [37466-016], ref: "TS 37.466 §6.6.2 p.24-25（SendConfigurationData 0x32）"}
      busy: {type: bool, default: false, note: "TCP {SetTilt, Calibrate, SelfTest} 執行中；並行 EP 上限 1，disallowed 者回 Busy", norm: 3GPP-N, src: [37466-010], ref: "TS 37.466 §6.2.3 Table 6.2.3.1 p.11-12"}
      active_alarms: {type: "uint8[]", default: [], note: "AlarmCode 為 ReturnCode 的子集（Annex A，未摘錄）；任何 reset 清除全部", norm: 3GPP-N, src: [37466-009, 37466-017], ref: "TS 37.466 §6.2.1 p.11; §6.6.5 p.26-27"}
      alarm_subscribed: {type: bool, default: false, note: "reset 後歸 false；未訂閱不發 AlarmIndication", norm: 3GPP-N, src: [37466-017], ref: "TS 37.466 §6.6.5 p.26-27（AlarmIndication 0x07，Class 2）"}
      set_tilt_response_limit_s: {type: const, value: 120, unit: s, norm: 3GPP-N, src: [37466-012, 37466-019], ref: "TS 37.466 §6.6.3 p.25 / §6.7.2 p.29-30（<2 min）"}
      calibrate_response_limit_s: {type: const, value: 240, unit: s, norm: 3GPP-N, src: [37466-015], ref: "TS 37.466 §6.6.1 p.23-24（<4 min）"}
      tilt_overshoot_limit: {type: const, value: 5, unit: "0.1 deg", norm: 3GPP-N, src: [37466-012, 37466-019], ref: "TS 37.466 §6.6.3 p.25-26（不得超出 [current, requested] 區間 5 個單位 = 0.5 度）"}
      self_test_travel_limit_pct: {type: const, value: 5, unit: "%", norm: 3GPP-N, src: [37466-018], ref: "TS 37.466 §6.5.6 p.18-19（致動器移動不得超過總行程 +-5%）"}
      layer1_option: {type: enum, enum: [RS485, Modem], note: "Modem option 僅適用 UTRA/E-UTRA BS 與 NR BS type 1-C", norm: 3GPP-N, src: [37461-001], ref: "TS 37.461 V19.0.0 §4.1 p.6"}
      data_rate_bps: {type: enum, enum: [9600, 38400, 115200], default: 9600, unit: bps, note: "+-3%；115200 僅 RS485", norm: 3GPP-N, src: [37461-001], ref: "TS 37.461 §4.1 p.6"}
      hdlc_max_frame_octets: {type: uint, range: [78, null], default: 78, unit: octets, norm: 3GPP-N, src: [37462-001], ref: "TS 37.462 V19.0.0 §4.2 p.7（frame 4..N，強制支援 N=78）"}
      hdlc_window_size: {type: uint, range: [1, 7], default: 1, norm: 3GPP-N, src: [37462-001], ref: "TS 37.462 §4.4 p.8"}
      oran_ald_port_id: {type: uint8, range: [0, 1], norm: ORAN-N, src: [MP-142], ref: "o-ran-ald-port（兩個連接器時為 0/1）"}
      tma_subunit:
        type: list
        applicable_when: "device_type == tma"
        item:
          max_gain_db: {type: float, unit: dB, wire_type: uint8, wire_unit: "dB/4", norm: 3GPP-N, src: [37466-023], ref: "TS 37.466 Annex B Table B.3 field 0x16"}
          min_gain_db: {type: float, unit: dB, wire_type: uint8, wire_unit: "dB/4", norm: 3GPP-N, src: [37466-023], ref: "TS 37.466 Annex B Table B.3 field 0x17"}
          gain_resolution_db: {type: float, unit: dB, wire_type: uint8, wire_unit: "dB/4", norm: 3GPP-N, src: [37466-023], ref: "TS 37.466 Annex B Table B.3 field 0x18"}
          supports_bypass: {type: bool, norm: 3GPP-N, src: [37466-023], ref: "TS 37.466 Annex B Table B.4 field 0x13 bit 0"}

validators:
  description: "跨層一致性規則，編號對應 antenna_spec_v2.md §9"
  rules:
    - {id: V-01, expr: "codebook.type=='typeI-SinglePanel' and P>2 -> nrof_ports == 2*n1*n2 and (P,n1,n2) in type1_sp_n1n2_table", src: [214-052]}
    - {id: V-02, expr: "codebook.type=='typeI-MultiPanel' -> nrof_ports == 2*ng*n1*n2 and (ng==4 -> codebook_mode==1)", src: [214-056]}
    - {id: V-04, expr: "nrof_ports in [1,2,4,8,12,16,24,32]", src: [211-031, 331-002]}
    - {id: V-05, expr: "N_tot in [48,64,128] -> (N_tot,K,N) in aggregated_ports and same qcl/pc offsets", src: [211-031, 214-071]}
    - {id: V-08, expr: "len(cbsr) == table_lookup(codebook_version, n1, n2)", src: [331-009, 214-054]}
    - {id: V-10, expr: "ri <= codebook_catalog[type].max_rank and ri_restriction[ri-1]==1", src: [214-068, 214-054]}
    - {id: V-11, expr: "pdsch_layers <= min(max_mimo_layers_pdsch_bwp, max_mimo_layers_pdsch_cell, ue.max_layers_dl, 8)", src: [331-012, 331-013, 306-018, 214-020]}
    - {id: V-12, expr: "pdsch_layers <= number_of_spatial_streams_dl", norm: DERIVED, src: [MP-070]}
    - {id: V-14, expr: "num_codewords == (1 if pdsch_layers<=4 else 2)", src: [211-015, 300-001]}
    - {id: V-15, expr: "len(pdsch_dmrs_ports) == pdsch_layers", src: [212-001, 211-023]}
    - {id: V-17, expr: "pusch_layers <= min(max_mimo_layers_pusch, pusch_max_rank); transform_precoding -> pusch_layers==1", src: [331-016, 331-017, 300-002]}
    - {id: V-18, expr: "tx_config=='nonCodebook' -> all(srs.nrof_ports==1)", src: [214-082]}
    - {id: V-20, expr: "beam_id==0 -> no_weights_applied; not bf_supported -> all(beam_id==0)", src: [CUS-033, CUS-011]}
    - {id: V-21, expr: "1 <= beam_id <= 32767 and beam_id in beam_id_domain_range", src: [CUS-033, MP-044]}
    - {id: V-22, expr: "distinct_beam_ids_per_symbol <= endpoint_beam_capacity.max_beams_per_symbol", src: [MP-062, CUS-091]}
    - {id: V-23, expr: "per slot, per beam_id: distinct_weight_sets <= 1", src: [CUS-014]}
    - {id: V-24, expr: "K_elements == M*N*P*Q and len(weights)==K_elements and len(mask)>=K_elements", src: [CUS-071, CUS-041, CUS-082]}
    - {id: V-25, expr: "hybrid -> K_elements == K_prime*p_dash", src: [CUS-017]}
    - {id: V-26, expr: "k == q*P*M*N + p*M*N + m*N + n", src: [CUS-072]}
    - {id: V-27, expr: "bitmasks disjoint, contiguous, popcount(or) <= 16", src: [CUS-003, MP-050]}
    - {id: V-28, expr: "eaxc_id unique per direction per O-RU", src: [MP-050, CUS-005]}
    - {id: V-29, expr: "ru_category=='CAT_A' -> every array P==1", src: [CUS-005]}
    - {id: V-32, expr: "bs_type=='1-O' -> num_tx_units>=8 and num_rx_units>=8; bs_type in ['1-O','2-O'] -> no tab_connectors", src: [104-032]}
    - {id: V-33, expr: "n_txu_counted == min(n_txu_active, 8*n_cells)", src: [104-046]}
    - {id: V-34, expr: "beam change keeps TRP constant if peak in ota_peak_directions_set", src: [104-043]}
    - {id: V-36, expr: "qcl_type2 present -> qcl_type2.qcl_type != qcl_type1.qcl_type", src: [214-002, 331-010]}
    - {id: V-37, expr: "len(tci_states) <= min(128, ue.max_configured_tci_per_cc); codepoints <= 8; unified active <= 16", src: [214-002, 321-005, 321-006]}
    - {id: V-38, expr: "repetition=='on' -> report_quantity in [cri-RSRP, cri-SINR, none] and nrof_ports in [1,2] (all equal)", src: [214-037, 214-038]}
    - {id: V-39, expr: "group_based -> reported==2 else reported==nrof_reported_rs", src: [214-040, 331-008]}
    - {id: V-41, expr: "all(q0.ports==1); implicit q0 <= 2", src: [213-011]}
    - {id: V-43, expr: "len(pathloss_rs) <= 4", src: [213-020]}
    - {id: V-44, expr: "tilt within [min_supported,max_supported] and multiple of granularity", src: [MP-049]}
    - {id: V-45, expr: "not (mplane_mask != all_ones and cplane_mask != all_ones)", src: [MP-122]}
    - {id: V-46, expr: "SE10/SE19 numPortc <= 64; SE16 antennas <= 64; SE27 N <= 256", src: [CUS-090]}
    - {id: V-49, expr: "declarations.n_rxu_counted == min(declarations.n_rxu_active, 8*declarations.n_cells)", src: [1411-010]}
    - {id: V-50, expr: "bs_type=='1-H' -> all(count(c.tx_min_cell_group_id)==1 for c in connectors if c.supports_tx) and all(count(c.rx_min_cell_group_id)==1 for c in connectors if c.supports_rx)", src: [1411-009, 1411-010, 1411-024]}
    - {id: V-51, expr: "set(union(c.demod_branch_ids for c in connectors)) covers every demodulation branch and len(set) == declarations.n_rxu_active", src: [1411-008, 1411-025]}
    - {id: V-52, expr: "bs_type=='1-H' -> all(len(c.tae_group_ids)>=1 for c in connectors)", src: [1411-024]}
    - {id: V-53, expr: "declarations.prated_c_sys_dbm == 10*log10(sum(10**(p/10) for p in connectors[].rated_carrier_output_power_dbm))", norm: DERIVED, src: [1411-007]}
    - {id: V-54, expr: "ret.min_electrical_tilt_deg <= ret.electrical_tilt_deg <= ret.max_electrical_tilt_deg and round(ret.electrical_tilt_deg*10) in int16_range", src: [37466-003, 37466-012, 37466-014]}
    - {id: V-55, expr: "0 <= ret.antenna_bearing_deg <= 359.9 and round(ret.antenna_bearing_deg*10) in [0,3599] and is_multiple_of(ret.installed_mechanical_tilt_deg, 0.1)", src: [37466-014]}
    - {id: V-56, expr: "ald.busy -> concurrent_eps <= 1 and concurrent_ep not in [SetTilt, Calibrate, SelfTest, ClearActiveAlarms, SendConfigurationData, DownloadStart, DownloadApplication, DownloadEnd] else return Busy", src: [37466-010]}
    - {id: V-57, expr: "ald.layer1_option=='Modem' -> bs_type=='1-C'; ald.data_rate_bps==115200 -> ald.layer1_option=='RS485'; ald.hdlc_max_frame_octets >= 78", src: [37461-001, 37462-001]}
