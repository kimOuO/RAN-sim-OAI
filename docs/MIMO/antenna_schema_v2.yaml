AntennaMode:
  description: "可切換的天線／MIMO 模式（由 RRC、M-plane 設定，屬半靜態）"
  mode_id: {type: string, norm: SIM, src: [], ref: "simulator 自訂"}
  active_arrays: {type: "string[]", norm: SIM, src: [MP-010], ref: "引用 physical_arrays.name"}
  antenna_mask_mplane:
    type: "map[array_name -> bitstring(K)]"
    default: all_ones
    encoding: base64
    norm: ORAN-N
    src: [MP-122]
    ref: "UP tx/rx-array-antenna-mask-config; MP §20.3.2.3"
  antenna_mask_index: {type: uint8, norm: ORAN-N, src: [MP-122], ref: "antenna-bitmask-index"}
  max_power_level_index: {type: uint8, note: "0 表示不降低功率", norm: ORAN-N, src: [MP-011, MP-125], ref: "UP supported-max-power-level"}
  beam_tilt_offset:
    elevation: {type: int16, range: [-90, 90], default: 0, unit: deg, norm: ORAN-N, src: [MP-049, ORAN-B20], ref: "RPC modify-predefined-beam-tilt-offset"}
    azimuth: {type: int16, range: [-90, 90], default: 0, unit: deg, norm: ORAN-N, src: [MP-049, ORAN-B20], ref: "同上"}
  null_steering_config:
    intended_nulls:
      type: list
      item:
        id: {type: uint8, norm: ORAN-N, src: [MP-131], ref: "UP null-steering-cfg-grp L772"}
        azimuth_angle: {type: int16, unit: "0.1 deg", optional: true, note: "未設定時為 elevation null stripe", norm: ORAN-N, src: [MP-131, CUS-013], ref: "CUS §12.4.2.3"}
        zenith_angle: {type: int16, unit: "0.1 deg", mandatory: true, norm: ORAN-N, src: [MP-131], ref: "UP"}
        null_width: {type: uint8, default: 1, norm: ORAN-N, src: [MP-131], ref: "UP"}
        null_freq: {type: uint32, norm: ORAN-N, src: [MP-131], ref: "UP"}
  pdsch_config:
    max_mimo_layers: {type: int, range: [1, 8], norm: 3GPP-N, src: [331-012, 331-013], ref: "38.331"}
    tci_states: {type: "list[TciState]", max_items: 128, norm: 3GPP-N, src: [331-012, 214-002], ref: "PDSCH-Config tci-StatesToAddModList"}
    dmrs: {type: ref, target: logical_port_capability.pdsch_dmrs, norm: 3GPP-N, src: [331-014], ref: "DMRS-DownlinkConfig"}
  pusch_config:
    tx_config: {type: ref, target: mimo_capability.pusch_tx_config, norm: 3GPP-N, src: [331-016], ref: "PUSCH-Config"}
    max_rank: {type: int, range: [1, 8], norm: 3GPP-N, src: [331-016], ref: "PUSCH-Config"}
    max_mimo_layers: {type: int, range: [1, 8], norm: 3GPP-N, src: [331-017], ref: "PUSCH-ServingCellConfig"}

RuntimeState:
  description: "動態狀態（每 slot／每事件更新）"
  carrier_state: {type: "map[carrier -> enum]", enum: [INACTIVE, SLEEP, ACTIVE], default: INACTIVE, norm: ORAN-N, src: [MP-085], ref: "UP active"}
  active_trx_mask:
    type: "map[array -> bitstring]"
    bit_order: "LSB 對應 element k=0（CUS §12.5.4 順序）；1 表示啟用，0 表示停用"
