# antenna_schema_v2.yaml
# 機器可讀 schema，對應 antenna_spec_v2.md。
# 每個欄位描述：{type, enum|range, unit, default, norm, src:[ID], ref}
# norm 取值：3GPP-N | 3GPP-TR | ORAN-N | DERIVED | SIM
# src 中的 ID 皆存在於 docs/MIMO/extracts/01~09。
meta:
  version: "2.0"
  spec_doc: antenna_spec_v2.md
  sources:
    TR38901: {version: V19.4.0, extract: 01_38901_38104.md}
    TS38104: {version: V19.5.0, extract: 01_38901_38104.md}
    TS38211: {version: V19.4.0, extract: 02_38211_38212.md}
    TS38212: {version: V19.4.0, extract: 02_38211_38212.md}
    TS38213: {version: V19.4.0, extract: 03_procedures.md}
    TS38214: {version: V19.4.0, extract: 03_procedures.md}
    TS38215: {version: V19.3.0, extract: 03_procedures.md}
    TS38321: {version: V19.3.0, extract: 03_procedures.md}
    TS38300: {version: V19.3.0, extract: 03_procedures.md}
    TS38331: {version: V19.3.0, extract: 04_38331_38306.md}
    TS38306: {version: V19.3.0, extract: 04_38331_38306.md}
    ORAN_YANG_2022: {version: "2022-12-05", extract: 05_oran.md}
    ORAN_CUS: {version: R005-v21.00, extract: 06_oran_cus_v21.md}
    ORAN_MP: {version: R005-v21.01, extract: 07_oran_mp_v21.md}
    TS38133: {version: V19.4.0, extract: 08_38133_38141-2.md}
    TS38141_2: {version: V19.5.0, extract: 08_38133_38141-2.md}
    TS38141_1: {version: V19.5.0, extract: 09_38141-1_ALD.md}
    TS37461: {version: V19.0.0, extract: 09_38141-1_ALD.md}
    TS37462: {version: V19.0.0, extract: 09_38141-1_ALD.md}
    TS37466: {version: V19.0.0, extract: 09_38141-1_ALD.md}

AntennaSystemSpec:
  description: "靜態規格（O-RU/gNB 能力與實體配置）"
  site:
    site_id: {type: string, norm: SIM, src: [], ref: "simulator 自訂"}
    position_gcs: {type: "float[3]", unit: m, norm: 3GPP-TR, src: [901-002], ref: "TR 38.901 V19.4.0 §7.1.2 p.19"}
    latitude: {type: float, range: [-90, 90], unit: deg, norm: ORAN-N, src: [WG1-005], ref: "WG1 Table 4.6.4.3-1 Req-4.6.004"}
    longitude: {type: float, range: [-180, 180], unit: deg, norm: ORAN-N, src: [WG1-005], ref: "WG1 Table 4.6.4.3-1 Req-4.6.005"}
    antenna_height: {type: float, unit: m, norm: ORAN-N, src: [WG1-005], ref: "WG1 Req-4.6.007（TS 28.662 §4.3.2）"}
    bs_class: {type: enum, enum: [WA, MR, LA], norm: 3GPP-N, src: [104-034, 1412-010], ref: "TS 38.104 V19.5.0 §4.4 p.31-32; TS 38.141-2 D.6"}
    declared_coordinate_system:
      reference_point: {type: string, norm: 3GPP-N, src: [1412-010], ref: "TS 38.141-2 V19.5.0 Table 4.6-1 D.1"}
      orientation: {type: string, norm: 3GPP-N, src: [1412-010], ref: "TS 38.141-2 V19.5.0 Table 4.6-1 D.2"}
      phi_range: {type: float, range: [-180, 180], unit: deg, norm: 3GPP-N, src: [1412-004], ref: "TS 38.141-2 §4.14 p.90-91"}
      theta_range: {type: float, range: [-90, 90], unit: deg, norm: 3GPP-N, src: [1412-004], ref: "TS 38.141-2 §4.14（仰角型，下傾為正）"}
    sectors:
      type: list
      item:
        sector_id: {type: uint, norm: SIM, src: [CUS-003], ref: "對應 eAxC BandSector_ID 概念"}
        bearing_alpha: {type: float, unit: deg, default: 0, norm: 3GPP-TR, src: [901-003], ref: "TR 38.901 §7.1.3 p.19-20"}
        downtilt_beta: {type: float, unit: deg, default: 0, norm: 3GPP-TR, src: [901-003, 901-007], ref: "TR 38.901 §7.1.3/§7.1.4"}
        slant_gamma: {type: float, unit: deg, default: 0, norm: 3GPP-TR, src: [901-003], ref: "TR 38.901 §7.1.3"}
        calibration_default_bearings: {type: "float[]", default: [30, 150, 270], unit: deg, norm: 3GPP-TR, src: [901-061], ref: "TR 38.901 Table 7.8-1 p.100"}
        ret:
          description: "RET（remote electrical tilt）幾何值；線上編碼為 0.1 度步距的整數（TS 37.466 §3.1/§4.4）。正值向下傾。"
          electrical_tilt_deg: {type: float, unit: deg, wire_type: int16, wire_unit: "0.1 deg", range_ref: "[min_electrical_tilt_deg, max_electrical_tilt_deg]", norm: 3GPP-N, src: [37466-003, 37466-012], ref: "TS 37.466 V19.0.0 §3.1 p.8; §6.6.3 p.25-26（SetTilt 0x33，解析度 0.1 度）"}
          min_electrical_tilt_deg: {type: float, unit: deg, wire_type: int16, wire_unit: "0.1 deg", norm: 3GPP-N, src: [37466-014], ref: "TS 37.466 Annex B Table B.1 field 0x07（Minimum supported electrical tilt）"}
          max_electrical_tilt_deg: {type: float, unit: deg, wire_type: int16, wire_unit: "0.1 deg", norm: 3GPP-N, src: [37466-014], ref: "TS 37.466 Annex B Table B.1 field 0x06（Maximum supported electrical tilt）"}
          installed_mechanical_tilt_deg: {type: float, unit: deg, wire_type: int16, wire_unit: "0.1 deg", norm: 3GPP-N, src: [37466-002, 37466-014], ref: "TS 37.466 Annex B Table B.1 field 0x26；機械 tilt 與電氣 tilt 為分開的兩個值（§3.1）"}
          antenna_bearing_deg: {type: float, unit: deg, range: [0, 359.9], wire_type: uint16, wire_range: [0, 3599], wire_unit: "0.1 deg", norm: 3GPP-N, src: [37466-014], ref: "TS 37.466 Annex B Table B.1 field 0x25"}
          antenna_model_number: {type: string, max_len: 15, charset: "ASCII 32..126", norm: 3GPP-N, src: [37466-006, 37466-014], ref: "TS 37.466 Annex B Table B.1 field 0x01"}
          antenna_serial_number: {type: string, max_len: 17, charset: "ASCII 32..126", norm: 3GPP-N, src: [37466-014], ref: "TS 37.466 Annex B Table B.1 field 0x02"}
          base_station_id: {type: string, max_len: 32, charset: "ASCII 32..126", norm: 3GPP-N, src: [37466-014], ref: "TS 37.466 Annex B Table B.1 field 0x23"}
          sector_id_ald: {type: string, max_len: 32, charset: "ASCII 32..126", norm: 3GPP-N, src: [37466-014], ref: "TS 37.466 Annex B Table B.1 field 0x24"}

  physical_arrays:
    type: list
    item:
      name: {type: string, norm: ORAN-N, src: [MP-010], ref: "o-ran-uplane-conf v21.01 grouping parameters L1392"}
      direction: {type: enum, enum: [tx, rx], norm: ORAN-N, src: [MP-010], ref: "UP tx-arrays L5805 / rx-arrays L5942"}
      band_number: {type: uint16, norm: ORAN-N, src: [MP-072, MP-010], ref: "o-ran-module-cap band-number（TS 38.104 §5.2 band 整數）"}
      num_panels_Mg: {type: uint, range: [1, null], default: 1, norm: 3GPP-TR, src: [901-010], ref: "TR 38.901 §7.3.0 p.28"}
      num_panels_Ng: {type: uint, range: [1, null], default: 1, norm: 3GPP-TR, src: [901-010], ref: "TR 38.901 §7.3.0 p.28"}
      panel_spacing_dgH: {type: float, unit: lambda, norm: 3GPP-TR, src: [901-011], ref: "TR 38.901 §7.3.0; Table 7.8-2（2.5λ）"}
      panel_spacing_dgV: {type: float, unit: lambda, norm: 3GPP-TR, src: [901-011], ref: "TR 38.901 §7.3.0"}
      num_rows_M: {type: uint16, range: [1, 65535], norm: ORAN-N, src: [MP-010, CUS-071, 901-012], ref: "UP number-of-rows; CUS §12.5.3; TR 38.901 §7.3.0"}
      num_columns_N: {type: uint16, range: [1, 65535], norm: ORAN-N, src: [MP-010, CUS-071, 901-012], ref: "UP number-of-columns; CUS §12.5.3"}
      num_polarizations_P: {type: uint, range: [1, 2], norm: ORAN-N, src: [MP-010, CUS-071, 901-015], ref: "UP polarisations min 1 max 2; TR 38.901 §7.3.0"}
      num_array_layers_Q: {type: uint8, range: [1, 255], default: 1, norm: ORAN-N, src: [MP-010, CUS-071, CUS-075], ref: "UP number-of-array-layers; CUS §12.5.3, Annex K"}
      polarisations:
        type: list
        range: [1, 2]
        item:
          p: {type: uint8, norm: ORAN-N, src: [MP-010, CUS-071], ref: "CUS §12.5.3（依角度遞增排序）"}
          polarisation: {type: enum, enum: [MINUS_45, ZERO, PLUS_45, PLUS_90], norm: ORAN-N, src: [MP-010], ref: "UP typedef polarisation_type L507"}
      horizontal_spacing: {type: decimal64, fraction_digits: 5, unit: m, norm: ORAN-N, src: [MP-010, ORAN-014], ref: "UP horizontal-spacing"}
      vertical_spacing: {type: decimal64, fraction_digits: 5, unit: m, norm: ORAN-N, src: [MP-010, ORAN-015], ref: "UP vertical-spacing"}
      d_H_lambda: {type: float, unit: lambda, default: 0.5, norm: DERIVED, src: [901-014, MP-010], ref: "d_H = horizontal_spacing * f_c / c"}
      d_V_lambda: {type: float, unit: lambda, default: 0.5, norm: DERIVED, src: [901-014, MP-010], ref: "d_V = vertical_spacing * f_c / c"}
      normal_vector:
        azimuth_angle: {type: decimal64, fraction_digits: 4, unit: deg, norm: ORAN-N, src: [MP-010, CUS-070], ref: "UP normal-vector-direction; CUS §12.5.2"}
        zenith_angle: {type: decimal64, fraction_digits: 4, unit: deg, norm: ORAN-N, src: [MP-010, CUS-070], ref: "UP normal-vector-direction; 90 = horizon"}
      leftmost_bottom_position:
        x: {type: decimal64, fraction_digits: 4, unit: m, norm: ORAN-N, src: [MP-010], ref: "UP leftmost-bottom-array-element-position"}
        y: {type: decimal64, fraction_digits: 4, unit: m, norm: ORAN-N, src: [MP-010], ref: "同上"}
        z: {type: decimal64, fraction_digits: 4, unit: m, norm: ORAN-N, src: [MP-010], ref: "同上"}
      K_elements: {type: uint, formula: "M*N*P*Q", range: [1, 16384], norm: ORAN-N, src: [CUS-071, CUS-082], ref: "CUS §12.5.3; antMask 上限 16384（§7.5.3.54）"}
      element_index_formula: {type: const, value: "k = q*P*M*N + p*M*N + m*N + n", norm: ORAN-N, src: [CUS-072], ref: "CUS §12.5.4"}
      element_pattern:
        model: {type: enum, enum: [TR38901_BS_Table7_3_1, TR38901_UT_Table7_3_2, isotropic, vendor], default: TR38901_BS_Table7_3_1, norm: 3GPP-TR, src: [901-020, 901-027], ref: "TR 38.901 Table 7.3-1 p.29 / Table 7.3-2 p.31-32"}
        theta_3dB: {type: float, unit: deg, default: 65, note: "UT 為 125", norm: 3GPP-TR, src: [901-020, 901-027], ref: "Table 7.3-1 / 7.3-2"}
        phi_3dB: {type: float, unit: deg, default: 65, note: "UT 為 125", norm: 3GPP-TR, src: [901-021, 901-027], ref: "Table 7.3-1 / 7.3-2"}
        SLA_V: {type: float, unit: dB, default: 30, note: "UT 為 22.5", norm: 3GPP-TR, src: [901-020, 901-027], ref: "Table 7.3-1"}
        A_max: {type: float, unit: dB, default: 30, note: "UT 為 22.5；同時為水平切面與 3D pattern 的上限", norm: 3GPP-TR, src: [901-021, 901-022], ref: "Table 7.3-1"}
        G_E_max: {type: float, unit: dBi, default: 8, note: "UT 為 5.3", norm: 3GPP-TR, src: [901-023, 901-027], ref: "Table 7.3-1 p.29"}
        hpbw_h: {type: float, unit: deg, norm: ORAN-N, src: [CUS-071], ref: "CUS §12.5.3 -3 dB beamwidth"}
        hpbw_v: {type: float, unit: deg, norm: ORAN-N, src: [CUS-071], ref: "CUS §12.5.3"}
        qpbw_h: {type: float, unit: deg, norm: ORAN-N, src: [CUS-071], ref: "CUS §12.5.3 -6 dB beamwidth"}
        qpbw_v: {type: float, unit: deg, norm: ORAN-N, src: [CUS-071], ref: "CUS §12.5.3"}
      polarization_model: {type: enum, enum: [model1, model2], default: model2, norm: 3GPP-TR, src: [901-032, 901-033, 901-063], ref: "TR 38.901 §7.3.2 p.33; calibration 採用 Model-2"}
      calibration_notation: {type: object, fields: [M, N, P, Mg, Ng, Mp, Np], note: "Mp/Np 為每 panel、每極化的 TXRU 數", norm: 3GPP-TR, src: [901-060], ref: "TR 38.901 Table 7.8-1A p.101 等"}
      relations:
        type: list
        item:
          peer_array: {type: string, norm: ORAN-N, src: [MP-013], ref: "UP relations L6003"}
          relation_type: {type: enum, enum: [SHARED, COALOCATED], note: "COALOCATED 為原文拼字", norm: ORAN-N, src: [MP-013, CUS-073], ref: "CUS §12.5.5"}
          pairs: {type: "list[uint16,uint16]", norm: ORAN-N, src: [MP-013], ref: "element-array1 / element-array2"}
      related_o_ru_connectors:
        type: list
        item:
          name: {type: string, norm: ORAN-N, src: [MP-010, MP-144], ref: "class O-RU-ANTENNA-CONNECTOR"}
          array_element_id: {type: "uint16[]", norm: ORAN-N, src: [MP-010, CUS-072], ref: "語意依 CUS §12.5.4"}
      tx_only:
        min_gain: {type: decimal64, unit: dB, norm: ORAN-N, src: [MP-011], ref: "UP tx-arrays/min-gain"}
        max_gain: {type: decimal64, unit: dB, mandatory: true, norm: ORAN-N, src: [MP-011], ref: "UP tx-arrays/max-gain"}
        independent_power_budget: {type: bool, mandatory: true, norm: ORAN-N, src: [MP-011], ref: "UP tx-arrays/independent-power-budget"}
        max_rms_power_per_element_W: {type: float, unit: W, norm: ORAN-N, src: [CUS-076], ref: "CUS §8.1.3.3 m_a,k"}
      rx_only:
        gain_correction_min: {type: decimal64, unit: dB, norm: ORAN-N, src: [MP-012], ref: "UP gain-correction-range/min"}
        gain_correction_max: {type: decimal64, unit: dB, norm: ORAN-N, src: [MP-012], ref: "UP gain-correction-range/max"}

  rf:
    bs_type: {type: enum, enum: ["1-C", "1-H", "1-O", "2-O"], norm: 3GPP-N, src: [104-006], ref: "TS 38.104 V19.5.0 §3.1 p.21"}
    ru_category: {type: enum, enum: [CAT_A, CAT_B], norm: ORAN-N, src: [MP-070, CUS-001], ref: "o-ran-module-cap ru-supported-category; CUS §4.2.1"}
    num_tx_units: {type: uint, range: [1, null], note: "bs_type 1-O 時 >= 8", norm: 3GPP-N, src: [104-031, 104-032], ref: "TS 38.104 §4.3.2/§4.3.3 p.30-31"}
    num_rx_units: {type: uint, range: [1, null], note: "bs_type 1-O 時 >= 8", norm: 3GPP-N, src: [104-032], ref: "TS 38.104 §4.3.3 p.31"}
    n_cells: {type: uint, range: [1, null], norm: 3GPP-N, src: [104-046], ref: "TS 38.104 §6.1 p.69"}
    n_txu_active: {type: uint, norm: 3GPP-N, src: [104-046], ref: "TS 38.104 §6.1"}
    n_txu_counted: {type: uint, formula: "min(n_txu_active, 8*n_cells)", norm: 3GPP-N, src: [104-046], ref: "TS 38.104 §6.1 p.69"}
    tab_connectors:
      type: list
      applicable_when: "bs_type == 1-H"
      item:
        id: {type: uint, norm: 3GPP-N, src: [104-024], ref: "TS 38.104 §3.1 p.24"}
        tx_min_cell_group: {type: uint, norm: 3GPP-N, src: [104-046], ref: "TS 38.104 §6.1（mapping implementation dependent）"}
    rated_carrier_trp_dBm: {type: float, unit: dBm, note: "1-O：MR <= 47、LA <= 33", norm: 3GPP-N, src: [104-043, 1412-013], ref: "TS 38.104 Table 9.3.1-1 p.229; TS 38.141-2 D.37"}
    eaxc_format:
      o_du_port_bitmask: {type: uint16, norm: ORAN-N, src: [MP-050, CUS-003], ref: "UP grouping eaxc L1337"}
      band_sector_bitmask: {type: uint16, norm: ORAN-N, src: [MP-050], ref: "UP grouping eaxc"}
      ccid_bitmask: {type: uint16, norm: ORAN-N, src: [MP-050], ref: "UP grouping eaxc"}
      ru_port_bitmask: {type: uint16, norm: ORAN-N, src: [MP-050], ref: "UP grouping eaxc"}
      total_bits: {type: const, value: 16, norm: ORAN-N, src: [CUS-003, MP-050], ref: "CUS §5.1.3.2.7; MP §15.2.2"}
      bit_order_msb_first: {type: const, value: [DU_Port_ID, BandSector_ID, CC_ID, RU_Port_ID], norm: ORAN-N, src: [CUS-003], ref: "CUS Table 5.1.3.2.7-2"}
    endpoints:
      type: list
      item:
        name: {type: string, norm: ORAN-N, src: [ORAN-031, ORAN-033], ref: "static-/low-level-[tr]x-endpoints"}
        direction: {type: enum, enum: [tx, rx], norm: ORAN-N, src: [ORAN-031, ORAN-032], ref: "UP"}
        array: {type: leafref, target: physical_arrays.name, norm: ORAN-N, src: [ORAN-031], ref: "static-low-level-tx-endpoints/array"}
        eaxc_id: {type: uint16, range: [0, 65535], unique_per_direction: true, norm: ORAN-N, src: [MP-050, CUS-003], ref: "MP §15.2.3"}
        configured_bf_profile_id: {type: uint16, norm: ORAN-N, src: [MP-061], ref: "UP L4822"}
        bf_methods: {type: "enum[]", enum: [NOBF, PDBF, WDBF, ABBF, CIBF, DMRS_BF_EQ, DMRS_BF_NEQ], norm: ORAN-N, src: [MP-005, MP-061], ref: "UP typedef beamforming-method-type L536"}
        energy_sharing_group_id: {type: "uint8[]", norm: ORAN-N, src: [MP-063], ref: "UP L4435"}
    number_of_ru_ports_dl: {type: uint8, note: "值為 255 時使用 extended（uint16 >= 256）", norm: ORAN-N, src: [MP-070], ref: "MC ru-capabilities L636"}
    number_of_ru_ports_ul: {type: uint8, norm: ORAN-N, src: [MP-070], ref: "MC ru-capabilities"}
    number_of_spatial_streams: {type: uint8, note: "v21.01：DL 與 UL 最大累計空間流數", norm: ORAN-N, src: [MP-070, ORAN-M05], ref: "MC number-of-spatial-streams"}
    number_of_spatial_streams_dl: {type: uint8, norm: ORAN-N, src: [MP-070], ref: "MC（2023-04-10 新增）"}
    number_of_spatial_streams_ul: {type: uint8, norm: ORAN-N, src: [MP-070], ref: "MC"}
    min_precoded_streams_odu_cat_a: {type: const, value: 8, norm: ORAN-N, src: [CUS-002], ref: "CUS §4.2.2.1"}
    tx_array_carriers:
      type: list
      item:
        name: {type: string, norm: ORAN-N, src: [ORAN-070], ref: "UP tx-array-carriers"}
        center_of_channel_bandwidth: {type: uint64, unit: Hz, norm: ORAN-N, src: [ORAN-070], ref: "UP L932"}
        channel_bandwidth: {type: uint64, unit: Hz, norm: ORAN-N, src: [ORAN-070], ref: "UP"}
        active: {type: enum, enum: [INACTIVE, SLEEP, ACTIVE], default: INACTIVE, norm: ORAN-N, src: [MP-085], ref: "UP L1701; MP §15.3.2"}
        gain: {type: decimal64, unit: dB, mandatory: true, norm: ORAN-N, src: [MP-080, CUS-076], ref: "UP L5496; CUS §8.1.3.3"}
        carrier_max_power_reduction: {type: decimal64, range: [0, null], unit: dB, norm: ORAN-N, src: [MP-081], ref: "UP L5509"}
        t_da_offset: {type: uint32, unit: Tc, default: 0, norm: ORAN-N, src: [MP-084], ref: "UP t-da-offset"}
        reference_level: {type: decimal64, unit: dB, default: 0, norm: ORAN-N, src: [MP-084], ref: "UP reference-level"}
        configured_tx_beamId_table_index: {type: uint8, norm: ORAN-N, src: [MP-082], ref: "UP L1845"}
    calibration:
      self_calibration_support: {type: bool, default: false, norm: ORAN-N, src: [MP-150], ref: "o-ran-antenna-calibration"}
      coordinated_calibration_support: {type: bool, default: false, norm: ORAN-N, src: [MP-150], ref: "o-ran-antenna-calibration"}
      calibration_period: {type: uint16, unit: min, norm: ORAN-N, src: [MP-150], ref: "o-ran-antenna-calibration"}
    ald_ports:
      type: list
      item:
        port_id: {type: uint8, norm: ORAN-N, src: [MP-142], ref: "o-ran-ald-port"}
        dc_control_support: {type: bool, norm: ORAN-N, src: [MP-142], ref: "o-ran-ald-port"}
        supported_connector: {type: enum, enum: [ANTENNA_CONNECTOR, RS485_PORT], norm: ORAN-N, src: [MP-142], ref: "o-ran-ald-port"}
        ald_req_msg_max_bytes: {type: const, value: 1200, norm: ORAN-N, src: [MP-141], ref: "MP §14.4.3（AISG 2.0 透傳）"}
    ret_tilt_deg:
      moved_to: AntennaSystemSpec.site.sectors.item.ret.electrical_tilt_deg
      type: float
      unit: deg
      wire_type: int16
      wire_unit: "0.1 deg"
      norm: 3GPP-N
      src: [37466-003, 37466-012, 37466-014]
      ref: "TS 37.466 V19.0.0 §3.1 p.8（tilt value = 10 x 電氣下傾角，signed integer，正值向下）；值域上下界由 device data 0x06/0x07 宣告（Annex B Table B.1）"
      note: "RET 機電 tilt。與 O-RAN 數位 beam tilt offset（RuntimeState.beam_tilt_state，MP-049，int16 -90..90 deg）為兩套獨立參數，單位/解析度/控制路徑皆不同，不可互換（R-L6-49）"
    declarations:
      description: "TS 38.141-1 V19.5.0 §4.6 Table 4.6-1 的傳導宣告（D.x）；1-H 專屬者已註明"
      n_cells: {type: uint, range: [1, null], applicable_when: "bs_type == 1-H", norm: 3GPP-N, src: [1411-023], ref: "TS 38.141-1 Table 4.6-1 D.24（per operating band）"}
      n_rxu_active: {type: uint, range: [1, null], note: "= 第 8 章效能需求宣告的 demodulation branch 數", norm: 3GPP-N, src: [1411-008], ref: "TS 38.141-1 §3.2 p.27-28"}
      n_rxu_counted: {type: uint, formula: "min(n_rxu_active, 8*n_cells)", norm: 3GPP-N, src: [1411-010], ref: "TS 38.141-1 §7.6.1 p.187"}
      prated_c_sys_dbm: {type: float, unit: dBm, formula: "power_sum(connectors[].rated_carrier_output_power_dbm)", norm: 3GPP-N, src: [1411-007], ref: "TS 38.141-1 §3.2 p.28（Prated,c,sys = sum of Prated,c,TABC，單一 carrier）"}
      iuant_modem_spurious_min_hz: {type: const, value: 20000000, unit: Hz, norm: 3GPP-N, src: [1411-012], ref: "TS 38.141-1 §4.5.3 p.47（modem ON 時 spurious 只量 >20 MHz）"}
      no_mimo_layer_declaration: {type: const, value: true, norm: 3GPP-N, src: [1411-026, 1411-020], ref: "Table 4.6-1 無 MIMO 層數/antenna port 數/NTXU,active/NRXU,active 宣告（負面規則 R-L2-40）"}
    connectors:
      type: list
      description: "1-C 的 antenna connector 或 1-H 的 TAB connector；38.141-1 的傳導宣告皆為 per connector"
      item:
        connector_id: {type: string, norm: SIM, src: [1411-020], ref: "標準無 connector id 欄位，僅為 schema 索引"}
        kind: {type: enum, enum: [antenna_connector, tab_connector], norm: 3GPP-N, src: [1411-001, 1411-002], ref: "TS 38.141-1 §3.1 p.24-26"}
        band_capability: {type: enum, enum: [single-band, multi-band], norm: 3GPP-N, src: [1411-006, 1411-021], ref: "TS 38.141-1 §3.1 p.25-26; Table 4.6-1 D.8"}
        operating_bands: {type: "string[]", norm: 3GPP-N, src: [1411-021], ref: "TS 38.141-1 Table 4.6-1 D.3（per connector）"}
        channel_bandwidths_by_scs: {type: "map[scs -> float[]]", unit: MHz, norm: 3GPP-N, src: [1411-022], ref: "TS 38.141-1 Table 4.6-1 D.14"}
        max_bs_rf_bandwidth_mhz: {type: float, unit: MHz, norm: 3GPP-N, src: [1411-022], ref: "TS 38.141-1 Table 4.6-1 D.11（單頻）/D.12（多頻）"}
        max_carriers_single_band: {type: uint, norm: 3GPP-N, src: [1411-022], ref: "TS 38.141-1 Table 4.6-1 D.17"}
        rated_carrier_output_power_dbm: {type: "float[]", unit: dBm, max_items: 3, note: "依 DL QAM 能力可 1..3 組（NOTE 1/NOTE 7）", norm: 3GPP-N, src: [1411-023, 1411-027], ref: "TS 38.141-1 Table 4.6-1 D.21（Prated,c,AC / Prated,c,TABC）"}
        rated_total_output_power_dbm: {type: float, unit: dBm, norm: 3GPP-N, src: [1411-023], ref: "TS 38.141-1 Table 4.6-1 D.22"}
        tx_min_cell_group_id: {type: uint, cardinality: "exactly 1 per operating band（支援 TX 時）", applicable_when: "bs_type == 1-H", norm: 3GPP-N, src: [1411-003, 1411-009, 1411-024], ref: "TS 38.141-1 §6.1.2 p.91; Table 4.6-1 D.34"}
        rx_min_cell_group_id: {type: uint, cardinality: "exactly 1 per operating band（支援 RX 時）", applicable_when: "bs_type == 1-H", norm: 3GPP-N, src: [1411-004, 1411-010, 1411-024], ref: "TS 38.141-1 §7.6.1 p.187; Table 4.6-1 D.33"}
        tae_group_ids: {type: "uint[]", min_items: 1, applicable_when: "bs_type == 1-H", norm: 3GPP-N, src: [1411-024], ref: "TS 38.141-1 Table 4.6-1 D.31（TAB connector beam forming group）"}
        equivalent_group_id: {type: uint, nullable: true, default: null, norm: 3GPP-N, src: [1411-024], ref: "TS 38.141-1 Table 4.6-1 D.32（equivalent connectors）"}
        demod_branch_ids: {type: "uint[]", applicable_when: "bs_type == 1-H", norm: 3GPP-N, src: [1411-025], ref: "TS 38.141-1 Table 4.6-1 D.37（每個 demodulation branch 至少宣告一個 TAB connector）"}
    port_to_trx_mapping:
      type: "matrix[N_port x N_TRX]"
      default: identity
      norm: SIM
      src: [211-001, 104-031, CUS-004]
      ref: "無標準"
      why_sim: "38.211 將 port 定義為邏輯概念；38.104 將 TRXUA 與 RDN 規定為 implementation specific；O-RAN 僅定義 eAxC 到 stream 的對應"
    rf_weight_matrix_W_RF:
      type: "complex matrix[K x N_TRX]"
      default: full_connection
      norm: SIM
      src: [901-030, 901-068, CUS-071, MP-043]
      ref: "無一般化標準"
      why_sim: "38.901 只有 ULA 固定 tilt 權重 w_m；O-RAN 僅提供 hybrid 的 h(k) 映射與 TD 權重維度 p'，element-to-TRX 類比網路未標準化"

