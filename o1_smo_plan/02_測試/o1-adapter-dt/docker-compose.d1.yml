# D1:DT telnet 假面 + 兩顆 o1-adapter。
#  - facade 跑 host network,直連 CU 8101 / DU 8102,聽 9091(CU-CP 身分)/ 9092(DU 身分)。
#  - adapter 走 bridge + 埠映射(netopeer2 固定聽 830、sshd 固定聽 22,不能跟主機搶),telnet 目標填主機 IP。
#  - ME:CU-CP 身分 = gnb_208_095_000e00(多小區);DU 身分 = gnb_208_095_000e00_du1(頻寬/PCI/負載)。
name: o1-d1
services:
  facade:
    build: ./facade
    image: o1-telnet-facade:dt
    container_name: o1-d1-facade
    network_mode: host
    environment:
      CU_URL: http://127.0.0.1:8101
      DU_URL: http://127.0.0.1:8102
      GNB_NAME: gnb_208_095_000e00
      VENDOR: "MITLAB RANsim-DT"
      DU_CELL: ""
      CUCP_PORT: "9091"
      DU_PORT: "9092"
    restart: unless-stopped
  adapter-cucp:
    image: adapter-gnb:dt
    container_name: o1-d1-adapter-cucp
    depends_on: [facade]
    ports: ["1830:830", "1222:22"]
    # 2026-10-13:改由 env 產生 config.json、使用映像內建範本(不再掛主機範本 —— 範本含劇本佔位字,
    # 只有 env 模式的 entrypoint 會替換;掛進來的話佔位字會原樣送出,而 sed 也會改到主機檔)。
    # 不設 O1_LIFECYCLE → 常駐節點:PM 不加 SubNetwork、標 permanent,SMO 永不自動清理。
    environment:
      O1_NODE_ID: gnb_208_095_000e00
      O1_UNIT_TYPE: CU-CP
      O1_HOST: 10.3.0.217
      O1_NETCONF_PORT: "1830"
      O1_SFTP_PORT: "1222"
      O1_TELNET_HOST: 10.3.0.217
      O1_TELNET_PORT: "9091"
      O1_GNB_DU_ID: "1"
      O1_GNB_CU_ID: "0"
      O1_PM_INTERVAL: "900"
      O1_HEARTBEAT: "30"
      O1_VES_URL: http://10.3.0.204:30417/eventListener/v7
      O1_MODEL: ransim-dt-cucp
      O1_LOCATION: "DT RAN sim host 10.3.0.217 (D1 facade, live CU/DU data)"
    volumes:
      - ./ftp-cucp:/ftp
    restart: unless-stopped
  adapter-du:
    image: adapter-gnb:dt
    container_name: o1-d1-adapter-du
    depends_on: [facade]
    ports: ["1831:830", "1223:22"]
    # 2026-10-13:改由 env 產生 config.json、使用映像內建範本(不再掛主機範本 —— 範本含劇本佔位字,
    # 只有 env 模式的 entrypoint 會替換;掛進來的話佔位字會原樣送出,而 sed 也會改到主機檔)。
    # 不設 O1_LIFECYCLE → 常駐節點:PM 不加 SubNetwork、標 permanent,SMO 永不自動清理。
    environment:
      O1_NODE_ID: gnb_208_095_000e00_du1
      O1_UNIT_TYPE: DU
      O1_HOST: 10.3.0.217
      O1_NETCONF_PORT: "1831"
      O1_SFTP_PORT: "1223"
      O1_TELNET_HOST: 10.3.0.217
      O1_TELNET_PORT: "9092"
      O1_GNB_DU_ID: "1"
      O1_GNB_CU_ID: "0"
      O1_PM_INTERVAL: "900"
      O1_HEARTBEAT: "30"
      O1_VES_URL: http://10.3.0.204:30417/eventListener/v7
      O1_MODEL: ransim-dt-du
      O1_LOCATION: "DT RAN sim host 10.3.0.217 (D1 facade, live CU/DU data)"
    volumes:
      - ./ftp-du:/ftp
    restart: unless-stopped
